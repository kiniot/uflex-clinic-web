<app-admin-shell
  [brand]="brand()"
  [navItems]="navItems()"
  [bottomItems]="bottomItems()"
  [searchPlaceholder]="searchPlaceholder()"
  [menuToggleLabel]="menuToggleLabel()"
>
  <div topbar-actions class="portal__actions">
    <span class="portal__role-pill">{{ rolePillLabel() }}</span>
    <app-language-switcher />
    <app-theme-switcher />
    <p-avatar shape="circle" size="normal" styleClass="portal__avatar" icon="pi pi-user" />
    @if (currentEmail()) {
      <div class="portal__user-info">
        <span class="portal__user-email">{{ currentEmail() }}</span>
        <span class="portal__user-role">{{ currentRoleLabel() }}</span>
      </div>
    }
  </div>

  <router-outlet />
</app-admin-shell>

<app-clinic-admin-profile-prompt-dialog
  [(visible)]="profilePromptVisible"
  (complete)="openProfileSetup()"
  (postpone)="postponeProfileSetup()"
/>
